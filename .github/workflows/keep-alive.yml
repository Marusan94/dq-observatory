name: Keep alive dq-backend

# Interruptor: archivo .keep-alive en la raíz del repo.
#   on  -> pingea /health cada 5 min (semanas de uso/demo)
#   off -> no hace nada (ahorra horas gratis de Render)
# Cambiar con: editar .keep-alive, commit, push.
# Despertar ya: Actions -> Keep alive dq-backend -> Run workflow.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer interruptor
        id: switch
        run: |
          FLAG="$(tr -d '[:space:]' < .keep-alive)"
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          echo "switch=$FLAG"
      - name: Ping backend
        if: steps.switch.outputs.flag == 'on' || github.event_name == 'workflow_dispatch'
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 90 https://dq-backend-vz1v.onrender.com/health; then
              echo
              echo "backend despierto"
              exit 0
            fi
            echo "reintento $i..."
            sleep 30
          done
          exit 1
