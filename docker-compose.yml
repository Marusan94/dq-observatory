services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dqpass
      POSTGRES_DB: dq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: { context: ., dockerfile: Dockerfile.backend }
    environment:
      DATABASE_URL: postgresql://dq:dqpass@postgres:5432/dq
      STORAGE_PATH: /data/storage
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [postgres]
    volumes: [storage:/data/storage]
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata:
  storage:
