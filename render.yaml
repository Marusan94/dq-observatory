services:
  - type: web
    name: dq-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: dq-postgres, property: connectionString }
      - key: CORS_ORIGINS
        value: https://dq-observatory.onrender.com
  - type: web
    name: dq-observatory
    env: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
databases:
  - name: dq-postgres
    plan: free
